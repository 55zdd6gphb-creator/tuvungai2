<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster Hub - GitHub Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Hiệu ứng lật 3D cho Flashcard */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* CSS Rung lắc khi trả lời sai game */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out infinite; }
        
        /* Tối ưu giao diện vừa vặn màn hình (Viewport-fit) */
        body {
            overflow-x: hidden;
            background: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between antialiased selection:bg-indigo-500 selection:text-white">

    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        // Giải nén các Hooks từ React toàn cục
        const { useState, useEffect, useMemo } = React;

        // Bảng dữ liệu chuẩn hóa 100% từ danh sách của bạn
        const defaultVocabulary = [
          { id: 1, word: "tough", type: "adj", defEN: "strong and durable; difficult to deal with", defVI: "bền bỉ, dai, cứng rắn, khó khăn", example: "The meat was tough, but the leather boots were even tougher.", syn: "hardy, resilient", ant: "tender, fragile", hint: "Đọc giống 'Tập' -> Tập luyện nhiều thì cơ thể sẽ bền bỉ, cứng rắn." },
          { id: 2, word: "segregation", type: "noun", defEN: "the action or state of setting someone or something apart from others", defVI: "sự phân biệt chủng tộc, sự chia tách", example: "The civil rights movement fought to end racial segregation.", syn: "separation, isolation", ant: "integration, unification", hint: "Seg-re-ga-tion -> Gần giống 'Xe rác ga sần' -> Xe chở rác phải bị cô lập, tách biệt ra ngoài." },
          { id: 3, word: "lead the way", type: "idiom", defEN: "to be a pioneer or leader in a particular field or path", defVI: "dẫn đường, tiên phong", example: "Our tech company aims to lead the way in green energy solutions.", syn: "pioneer, guide, head", ant: "follow, lag behind", hint: "Lead (Lãnh đạo) + The way (Con đường) -> Người đi đầu vạch ra con đường cho người khác theo." },
          { id: 4, word: "vulnerable", type: "adj", defEN: "susceptible to physical or emotional attack or harm", defVI: "dễ bị tổn thương, nguy hiểm", example: "Without secure encryption, your personal data is highly vulnerable.", syn: "exposed, defenseless", ant: "protected, invulnerable", hint: "Vulnerable -> Vần nơ rỡ bồ -> Dang nơ trêu bồ rất dễ bị bồ tẩn -> Dễ bị tổn thương." },
          { id: 5, word: "delicate", type: "adj", defEN: "very fine in texture or structure; easily broken or damaged", defVI: "mỏng manh, tinh tế, nhạy cảm", example: "The antique vase is extremely delicate, so please handle it with care.", syn: "fragile, dainty", ant: "robust, sturdy", hint: "Delicate -> 'Để ly cát' -> Để cái ly bằng cát thì cấu trúc của nó vô cùng mỏng manh, dễ vỡ." },
          { id: 6, word: "resilient", type: "adj", defEN: "able to withstand or recover quickly from difficult conditions", defVI: "kiên cường, đàn hồi, mau phục hồi", example: "The local economy proved resilient despite the global crisis.", syn: "tough, bouncy, adaptable", ant: "fragile, vulnerable", hint: "Resilient -> 'Rê dưa lên' -> Quả dưa hấu dù bị kéo rê lên dốc vẫn nguyên vẹn -> Rất kiên cường." },
          { id: 7, word: "continuous collaboration", type: "noun phr", defEN: "uninterrupted working together of parties to achieve a goal", defVI: "sự cộng tác liên tục", example: "The success of this open-source project relies on continuous collaboration.", syn: "ongoing teamwork", ant: "isolated work", hint: "Continuous (Liên tục) + Collaboration (Cộng tác, hợp tác)." },
          { id: 8, word: "collective", type: "adj/noun", defEN: "done by people acting as a group; referring to all members of a group", defVI: "tập thể, chung", example: "It was a collective decision made by all members of the board.", syn: "joint, combined, communal", ant: "individual, personal", hint: "Gốc từ giống Collect (thu thập) -> Gom mọi cá thể lại tạo thành một khối tập thể." },
          { id: 9, word: "detect", type: "verb", defEN: "to discover or identify the presence or existence of something", defVI: "phát hiện, dò tìm, nhận ra", example: "The security system can detect any unauthorized entry.", syn: "discover, notice, spot", ant: "ignore, overlook", hint: "Liên tưởng tới Detective (Thám tử) -> Công việc của thám tử là đi dò tìm, phát hiện manh mối." },
          { id: 10, word: "freeze", type: "verb", defEN: "turn into ice or another solid as a result of extreme cold", defVI: "đóng băng, đông cứng", example: "Water will freeze instantly under these extreme laboratory conditions.", syn: "solidify", ant: "melt", hint: "Freeze -> 'Phờ-ri-zơ' (Tủ freezer dùng để cấp đông thức ăn)." },
          { id: 11, word: "melt", type: "verb", defEN: "make or become liquefied by heating", defVI: "tan chảy", example: "The ice began to melt as soon as the sun came out.", syn: "dissolve, liquefy", ant: "freeze", hint: "Melt -> Đọc giống 'Mệt' -> Khi cơ thể mệt rã rời, cảm giác như cơ bắp đang tan chảy ra." },
          { id: 12, word: "condense", type: "verb", defEN: "change from a gas or vapor to a liquid; make denser", defVI: "ngưng tụ, cô đặc lại", example: "Steam condenses into water droplets when it hits a cold surface.", syn: "compress, concentrate", ant: "evaporate", hint: "Condensed milk chính là sữa đặc (ví dụ: sữa ông thọ) -> Sữa được làm cô đặc lại." },
          { id: 13, word: "evaporate", type: "verb", defEN: "turn from liquid into vapor", defVI: "bay hơi, bốc hơi", example: "The small puddles of rain water evaporated quickly under the hot sun.", syn: "vaporize, vanish", ant: "condense", hint: "Có chứa từ gốc 'Vapor' nghĩa là hơi nước -> Biến thành hơi nước = bay hơi." },
          { id: 14, word: "concerning symptom", type: "noun phr", defEN: "a physical or mental sign indicating a medical condition that causes anxiety", defVI: "triệu chứng đáng lo ngại", example: "A chronic short of breath is a concerning symptom you should check.", syn: "worrying sign", ant: "reassuring sign", hint: "Concerning (Đáng lo ngại, liên quan) + Symptom (Triệu chứng bệnh)." },
          { id: 15, word: "thrive", type: "verb", defEN: "to grow or develop well, to flourish or prosper vigorous", defVI: "phát triển mạnh mẽ, thịnh vượng", example: "Our online business continues to thrive in the modern digital market.", syn: "flourish, prosper, bloom", ant: "fail, wither, decline", hint: "Thrive -> Đọc lái thành 'Thờ rai' -> Chăm chỉ làm việc và có đức tin thì sẽ phát triển thịnh vượng." },
          { id: 16, word: "carry on", type: "phrasal v", defEN: "to continue doing something; keep + V_ing", defVI: "tiếp tục hành động gì đó", example: "Even when things get tough, you must carry on with your study.", syn: "continue, maintain, proceed", ant: "stop, halt, quit", hint: "Carry (mang vác) + On (tiếp tục hành trình) -> Vẫn tiếp tục gánh vác, không bỏ cuộc." },
          { id: 17, word: "check up on", type: "phrasal v", defEN: "to make sure that someone is doing what they should be doing or is safe", defVI: "kiểm tra xem ai đó đang làm gì/ổn không", example: "My parents always call to check up on me every weekend.", syn: "inspect, monitor, track", ant: "neglect, ignore", hint: "Check (Kiểm tra) + Up on (Sát sao phía trên) -> Theo sát để kiểm tra tiến độ/sức khỏe." },
          { id: 18, word: "keep one's fingers on the pulse", type: "idiom", defEN: "to monitor current trends; keep track of latest developments", defVI: "nắm bắt kịp thời các xu hướng/thông tin mới nhất", example: "As a marketer, she always keeps her fingers on the pulse of social media.", syn: "stay informed, keep track", ant: "be out of touch", hint: "Đặt ngón tay (fingers) lên mạch đập (pulse) của cổ tay -> Theo dõi nhịp đập xã hội liên tục." },
          { id: 19, word: "assess", type: "verb", defEN: "to evaluate or estimate the nature, ability, or quality of something", defVI: "đánh giá, định mức", example: "We need to assess the environmental impact before building the factory.", syn: "evaluate, appraise, judge", ant: "guess, ignore", hint: "Assess -> Âm đọc giống 'As-ses' -> Ngồi đặt mông lên ghế suy ngẫm để đưa ra ĐÁNH GIÁ." },
          { id: 20, word: "insight", type: "noun", defEN: "a deep, clear, and accurate understanding of a specific thing", defVI: "sự hiểu biết sâu sắc, cái nhìn thấu đáo", example: "The market research provides valuable insights into customer behavior.", syn: "understanding, wisdom, vision", ant: "ignorance, blindness", hint: "In (Vào trong) + Sight (Tầm nhìn) -> Nhìn thấu vào tận sâu bản chất bên trong." },
          { id: 21, word: "hand in hand", type: "idiom", defEN: "closely associated; working together in harmony toward a common goal", defVI: "gắn liền với nhau, tay trong tay, song hành", example: "Economic growth and environmental protection must go hand in hand.", syn: "together, jointly, linked", ant: "separately, apart", hint: "Tay trong tay -> Biểu trưng của sự gắn kết chặt chẽ, luôn đi kèm song hành." },
          { id: 22, word: "indicator", type: "noun", defEN: "a trend, signal, or sign that shows the condition or state of something", defVI: "chỉ số, dấu hiệu biểu thị", example: "High unemployment is a clear indicator of an economic downturn.", syn: "sign, signal, gauge, mark", ant: "counter-sign", hint: "Trong xe máy/ô tô, đèn xi-nhan báo rẽ chính là các 'indicators' (vật chỉ đường)." },
          { id: 23, word: "fluctuation", type: "noun", defEN: "an irregular rising and falling in number, amount, or stability", defVI: "sự biến động, dao động thất thường", example: "Wild fluctuation in stock prices can scare away new investors.", syn: "variation, shift, wave", ant: "stability, constancy", hint: "Fluctuation -> 'Phờ lúc chu du' -> Lúc lên voi lúc xuống chó, thay đổi liên tục." },
          { id: 24, word: "safeguard", type: "verb/noun", defEN: "to protect something from harm or damage with proactive measures", defVI: "bảo vệ, che chắn, biện pháp bảo vệ", example: "The new law is designed to safeguard the privacy rights of internet users.", syn: "protect, defend, shield", ant: "endanger, harm, imperil", hint: "Safe (An toàn) + Guard (Vệ sĩ/Bảo vệ) -> Vòng vây bảo vệ tuyệt đối an toàn." },
          { id: 25, word: "cherish", type: "verb", defEN: "protect and care for someone or something lovingly and deeply", defVI: "trân trọng, yêu thương, nâng niu, ấp ủ", example: "I will always cherish the beautiful memories we shared together.", syn: "treasure, value, hold dear", ant: "despise, neglect, ignore", hint: "Cherish -> Nghe như 'Quả Cherry' -> Trái cây đắt đỏ quý hiếm nên phải rất nâng niu, trân trọng." },
          { id: 26, word: "symphony", type: "noun", defEN: "an elaborate musical composition for a full grand orchestra", defVI: "bản nhạc giao hưởng", example: "He composed a magnificent symphony inspired by nature.", syn: "harmony, orchestra piece", ant: "cacophony", hint: "Sym (Cùng nhau, đồng điệu) + Phony (Âm thanh) -> Nhiều âm thanh hòa quyện thành giao hưởng." },
          { id: 27, word: "unify", type: "verb", defEN: "make or become united, uniform, or a single whole", defVI: "thống nhất, hợp nhất, đồng nhất", example: "The leader managed to unify the opposing political factions.", syn: "unite, merge, combine", ant: "divide, separate, split", hint: "Uni (Một - như từ Uniform) + fy (Biến đổi) -> Biến tất cả thành một thực thể thống nhất." },
          { id: 28, word: "remarkable", type: "adj", defEN: "worthy of attention; striking, extraordinary, or excellent", defVI: "đáng chú ý, xuất sắc, khác thường", example: "She showed remarkable talent for mathematics at a very young age.", syn: "extraordinary, notable, superb", ant: "ordinary, common, mediocre", hint: "Re-mark-able -> Gốc từ 'Mark' (đánh dấu) -> Có khả năng/đáng giá để đánh dấu lại vì quá xuất sắc." },
          { id: 29, word: "enhance", type: "verb", defEN: "intensify, increase, or further improve the quality, value, or power of", defVI: "nâng cao, tăng cường, cải thiện", example: "You can enhance the flavor of the soup by adding some fresh herbs.", syn: "improve, boost, upgrade", ant: "diminish, degrade, damage", hint: "Enhance -> Gần giống 'In hình lên' -> In thêm hình ảnh đẹp lên áo giúp tăng giá trị cái áo." },
          { id: 30, word: "carbon footprint", type: "noun", defEN: "the total amount of greenhouse gases caused by an individual or event", defVI: "dấu chân carbon (lượng khí thải carbon cá nhân)", example: "Switching to public transport is an effective way to reduce your carbon footprint.", syn: "CO2 emissions, carbon impact", ant: "eco-friendly asset", hint: "Carbon (Khí thải độc hại) + Footprint (Dấu chân) -> Vết tích hủy hoại môi trường ta để lại." },
          { id: 31, word: "processed foods", type: "noun", defEN: "food items that have been altered from natural state for safety/convenience", defVI: "thực phẩm đóng hộp, thực phẩm chế biến sẵn", example: "Processed foods are usually high in chemicals, salt, and fat.", syn: "convenience food, canned food", ant: "whole foods, fresh products", hint: "Processed (Đã qua xử lý nhà máy) + Foods (Thức ăn)." }
        ];

        // Thành phần biểu tượng của Lucide
        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            const LucideIcon = lucide[name];
            if (!LucideIcon) return null;
            return <LucideIcon className={className} {...props} />;
        };

        function App() {
            const [vocabList, setVocabList] = useState(() => {
                const saved = localStorage.getItem('hub_vocab_data_2026');
                return saved ? JSON.parse(saved) : defaultVocabulary;
            });

            // State Điều hướng & Tìm kiếm
            const [currentTab, setCurrentTab] = useState('deep-dive'); // deep-dive, flashcard, quiz, block-blast, manage
            const [currentIndex, setCurrentIndex] = useState(0);
            const [searchQuery, setSearchQuery] = useState('');

            // State Flashcard
            const [isFlipped, setIsFlipped] = useState(false);

            // State Trắc nghiệm (Quiz)
            const [quizScore, setQuizScore] = useState(0);
            const [quizStep, setQuizStep] = useState(0);
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [quizFinished, setQuizFinished] = useState(false);

            // State Minigame Block Blast
            const [gameBlocks, setGameBlocks] = useState([]);
            const [selectedBlock, setSelectedBlock] = useState(null);
            const [gameScore, setGameScore] = useState(0);
            const [wrongBlockIds, setWrongBlockIds] = useState([]);

            // State Quản lý dữ liệu & Form
            const [isEditingId, setIsEditingId] = useState(null);
            const [singleWord, setSingleWord] = useState('');
            const [bulkWords, setBulkWords] = useState('');
            const [editForm, setEditForm] = useState({ word: '', type: '', defVI: '', defEN: '', example: '', syn: '', ant: '', hint: '' });

            // Lưu LocalStorage đồng bộ liên tục
            useEffect(() => {
                localStorage.setItem('hub_vocab_data_2026', JSON.stringify(vocabList));
            }, [vocabList]);

            // Lọc danh sách từ dựa trên ô tìm kiếm
            const filteredVocab = useMemo(() => {
                return vocabList.filter(item => 
                    item.word.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    item.defVI.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [vocabList, searchQuery]);

            // Reset chỉ số nếu danh sách lọc thay đổi
            useEffect(() => {
                setCurrentIndex(0);
            }, [searchQuery]);

            // --- CÁC HÀM XỬ LÝ TRẮC NGHIỆM ---
            const startQuiz = () => {
                if (vocabList.length < 4) return;
                const shuffled = [...vocabList].sort(() => 0.5 - Math.random());
                const questions = shuffled.slice(0, Math.min(10, vocabList.length)).map(item => {
                    const pool = vocabList.filter(v => v.id !== item.id).sort(() => 0.5 - Math.random());
                    const wrongAnswers = pool.slice(0, 3).map(v => v.word);
                    const options = [...wrongAnswers, item.word].sort(() => 0.5 - Math.random());
                    return { target: item, options, correct: item.word };
                });
                setQuizQuestions(questions);
                setQuizStep(0);
                setQuizScore(0);
                setSelectedAnswer(null);
                setQuizFinished(false);
            };

            const handleAnswerQuiz = (ans) => {
                if (selectedAnswer) return;
                setSelectedAnswer(ans);
                if (ans === quizQuestions[quizStep].correct) {
                    setQuizScore(prev => prev + 10);
                }
            };

            const nextQuizStep = () => {
                setSelectedAnswer(null);
                if (quizStep + 1 < quizQuestions.length) {
                    setQuizStep(prev => prev + 1);
                } else {
                    setQuizFinished(true);
                }
            };

            // --- CÁC HÀM XỬ LÝ GAME BLOCK BLAST ---
            const startBlockBlast = () => {
                const size = Math.min(6, vocabList.length);
                const chosen = [...vocabList].sort(() => 0.5 - Math.random()).slice(0, size);
                let elements = [];
                chosen.forEach(item => {
                    elements.push({ id: `w-${item.id}`, parentId: item.id, text: item.word, kind: 'E' });
                    elements.push({ id: `v-${item.id}`, parentId: item.id, text: item.defVI.split(',')[0], kind: 'V' });
                });
                elements.sort(() => 0.5 - Math.random());
                setGameBlocks(elements);
                setSelectedBlock(null);
                setGameScore(0);
                setWrongBlockIds([]);
            };

            const handleBlockClick = (block) => {
                if (block.done || wrongBlockIds.length > 0) return;
                if (!selectedBlock) {
                    setSelectedBlock(block);
                    return;
                }
                if (selectedBlock.id === block.id) {
                    setSelectedBlock(null);
                    return;
                }

                if (selectedBlock.parentId === block.parentId && selectedBlock.kind !== block.kind) {
                    // Đúng cặp -> Biến mất khối
                    setGameBlocks(prev => prev.map(b => b.parentId === block.parentId ? { ...b, done: true } : b));
                    setGameScore(prev => prev + 25);
                    setSelectedBlock(null);
                } else {
                    // Sai cặp -> Rung lắc giật giật
                    setWrongBlockIds([selectedBlock.id, block.id]);
                    setGameScore(prev => Math.max(0, prev - 5));
                    setTimeout(() => {
                        setWrongBlockIds([]);
                        setSelectedBlock(null);
                    }, 500);
                }
            };

            // --- CÁC HÀM QUẢN LÝ TỪ (CRUD & AUTO ANALYZE) ---
            const handleAddSingleWord = () => {
                if (!singleWord.trim()) return;
                const newW = singleWord.trim();
                // Giả lập cơ chế Auto-AI tự động phân tích dữ liệu bị thiếu
                const analyzedItem = {
                    id: Date.now(),
                    word: newW.toLowerCase(),
                    type: "new word",
                    defEN: `Auto generated clear definition for ${newW}`,
                    defVI: `Nghĩa tự động của ${newW} (Vui lòng cập nhật)`,
                    example: `This is a contextual example demonstrating how to use ${newW} correctly.`,
                    syn: "updating...",
                    ant: "updating...",
                    hint: `Mẹo ghi nhớ từ ${newW}: Hãy liên tưởng âm thanh tương tự để ghi nhớ sâu.`
                };
                setVocabList([analyzedItem, ...vocabList]);
                setSingleWord('');
            };

            const handleAddBulkWords = () => {
                if (!bulkWords.trim()) return;
                const lines = bulkWords.split('\n');
                const addedItems = [];
                lines.forEach((line, idx) => {
                    const word = line.trim();
                    if (word) {
                        addedItems.push({
                            id: Date.now() + idx,
                            word: word.toLowerCase(),
                            type: "bulk word",
                            defEN: "Auto parsed definition.",
                            defVI: `Nghĩa của từ: ${word}`,
                            example: `Example sentence with ${word}.`,
                            syn: "n/a",
                            ant: "n/a",
                            hint: "Mẹo nhớ tự động dựa trên gốc từ."
                        });
                    }
                });
                setVocabList([...addedItems, ...vocabList]);
                setBulkWords('');
            };

            const deleteWord = (id) => {
                if (confirm("Bạn có chắc chắn muốn xóa từ vựng này không?")) {
                    setVocabList(prev => prev.filter(v => v.id !== id));
                }
            };

            const editClick = (item) => {
                setIsEditingId(item.id);
                setEditForm({ ...item });
            };

            const saveEdit = () => {
                setVocabList(prev => prev.map(v => v.id === isEditingId ? editForm : v));
                setIsEditingId(null);
            };

            const exportToGitHubJson = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(vocabList, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "vocab_github_standard.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            return (
                <div class="flex-1 flex flex-col h-full max-h-screen">
                    {/* Header */}
                    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between shadow-md shrink-0">
                        <div class="flex items-center space-x-3">
                            <div class="p-2 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl shadow-lg">
                                <Icon name="Sparkles" className="w-6 h-6 text-white" />

                                                <p class="text-[10px] text-slate-500 mt-2 font-medium">Hệ thống tự động phân tích cấu trúc, nghĩa bổ sung, mẹo tư duy cho bạn.</p>
                                            </div>

                                            {/* Thêm hàng loạt (Bulk Add) */}
                                            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-md">
                                                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2 flex items-center"><Icon name="Layers" className="w-3.5 h-3.5 mr-1 text-indigo-400" /> Nhập danh sách số lượng lớn</h3>
                                                <div class="flex space-x-2">
                                                    <textarea 
                                                        rows="1"
                                                        value={bulkWords}
                                                        onChange={(e) => setBulkWords(e.target.value)}
                                                        placeholder="Mỗi từ một dòng (Ví dụ:&#10;sustainability&#10;innovation)"
                                                        class="flex-1 bg-slate-950 border border-slate-800 rounded-lg text-xs px-3 py-1.5 text-white focus:outline-none focus:border-indigo-500 resize-none"
                                                    />
                                                    <button onClick={handleAddBulkWords} class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg transition shrink-0">
                                                        Nhập Bulk
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Thanh điều khiển GitHub / Lưu trữ */}
                                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-md">
                                            <div>
                                                <h3 class="text-xs font-bold text-white uppercase tracking-wider flex items-center"><Icon name="Download" className="w-4 h-4 mr-1 text-emerald-400" /> Tải dữ liệu chuẩn hóa về kho</h3>
                                                <p class="text-[11px] text-slate-400 mt-0.5">Xuất file cấu trúc JSON sạch để đồng bộ hóa lên GitHub cá nhân của bạn.</p>
                                            </div>
                                            <button onClick={exportToGitHubJson} class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition flex items-center justify-center space-x-1.5 shadow-md">
                                                <Icon name="Download" className="w-3.5 h-3.5" /> <span>Cho GitHub (Tải .json)</span>
                                            </button>
                                        </div>

                                        {/* Danh sách quản trị từ vựng hiển thị dưới dạng hàng */}
                                        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                                            <div class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center">
                                                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Bảng danh mục phân tích chi tiết ({vocabList.length} từ)</h3>
                                            </div>

                                            <div class="divide-y divide-slate-800/60 max-h-96 overflow-y-auto">
                                                {vocabList.map((item, idx) => (
                                                    <div key={item.id} class="p-4 hover:bg-slate-950/40 transition-all">
                                                        {isEditingId === item.id ? (
                                                            /* Trình Chỉnh Sửa Tại Chỗ */
                                                            <div class="space-y-3 bg-slate-950 p-3 rounded-xl border border-slate-800">
                                                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                                    <div>
                                                                        <label class="block text-[10px] text-slate-500 font-bold uppercase mb-1">Từ vựng (EN)</label>
                                                                        <input type="text" value={editForm.word} onChange={e => setEditForm({...editForm, word: e.target.value})} class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-xs text-white" />
                                                                    </div>
                                                                    <div>
                                                                        <label class="block text-[10px] text-slate-500 font-bold uppercase mb-1">Nghĩa Việt</label>
                                                                        <input type="text" value={editForm.defVI} onChange={e => setEditForm({...editForm, defVI: e.target.value})} class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-xs text-white" />
                                                                    </div>
                                                                    <div>
                                                                        <label class="block text-[10px] text-slate-500 font-bold uppercase mb-1">Thuộc tính từ</label>
                                                                        <input type="text" value={editForm.type} onChange={e => setEditForm({...editForm, type: e.target.value})} class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-xs text-white" />
                                                                    </div>
                                                                </div>
                                                                <div>
                                                                    <label class="block text-[10px] text-slate-500 font-bold uppercase mb-1">Định nghĩa tiếng Anh</label>
                                                                    <input type="text" value={editForm.defEN} onChange={e => setEditForm({...editForm, defEN: e.target.value})} class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-xs text-white" />
                                                                </div>
                                                                <div>
                                                                    <label class="block text-[10px] text-slate-500 font-bold uppercase mb-1">Ví dụ thực tế</label>
                                                                    <textarea rows="1" value={editForm.example} onChange={e => setEditForm({...editForm, example: e.target.value})} class="w-full bg-slate-900 border border-slate-800 rounded p-1 text-xs text-white resize-none" />
                                                                </div>
                                                                <div class="flex justify-end space-x-2 pt-1 border-t border-slate-900">
                                                                    <button onClick={() => setIsEditingId(null)} class="px-2.5 py-1 bg-slate-800 text-slate-400 text-[11px] font-bold rounded">Hủy</button>
                                                                    <button onClick={saveEdit} class="px-3 py-1 bg-indigo-600 text-white text-[11px] font-bold rounded flex items-center"><Icon name="Save" className="w-3 h-3 mr-1" /> Lưu thay đổi</button>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            /* Chế độ hiển thị danh sách dòng */
                                                            <div class="flex items-start justify-between gap-4">
                                                                <div class="space-y-1 flex-1">
                                                                    <div class="flex items-baseline space-x-2">
                                                                        <span class="text-xs font-bold text-slate-500">{idx + 1}.</span>
                                                                        <span class="text-sm font-black text-white">{item.word}</span>
                                                                        <span class="text-[10px] font-bold text-indigo-400 bg-indigo-500/10 px-1.5 py-0.5 rounded border border-indigo-500/20">{item.type}</span>
                                                                    </div>
                                                                    <p class="text-xs font-semibold text-emerald-400">{item.defVI}</p>
                                                                    <p class="text-[11px] text-slate-400 italic line-clamp-1">"{item.defEN}"</p>
                                                                </div>
                                                                <div class="flex space-x-1 shrink-0">
                                                                    <button onClick={() => editClick(item)} class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white rounded-lg transition" title="Sửa dữ liệu từ">
                                                                        <Icon name="Edit3" className="w-3.5 h-3.5" />
                                                                    </button>
                                                                    <button onClick={() => deleteWord(item.id)} class="p-1.5 bg-slate-800/60 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 rounded-lg transition" title="Xóa từ vựng">
                                                                        <Icon name="Trash2" className="w-3.5 h-3.5" />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                            </div>
                        )}
                    </main>

                    {/* Footer chân trang */}
                    <footer class="bg-slate-900 border-t border-slate-800 px-6 py-2.5 text-center text-[10px] text-slate-500 font-medium tracking-wide shrink-0">
                        VocabMaster Hub © 2026 Engine Edition. Built with React, Tailwind CSS and Lucide UI System Components.
                    </footer>
                </div>
            );
        }

        // Khởi tạo và render ứng dụng vào phần tử DOM #root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
