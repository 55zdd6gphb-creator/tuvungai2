<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master iOS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen w-screen overflow-hidden m-0 p-0">

    <div class="w-full h-full flex">
        <nav class="w-16 md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between p-2 md:p-4 shrink-0">
            <div>
                <div class="flex items-center gap-3 py-4 mb-4 border-b border-slate-800 justify-center md:justify-start">
                    <i data-lucide="sparkles" class="text-indigo-400 w-6 h-6 md:w-8 md:h-8"></i>
                    <h1 class="hidden md:block font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">VOCAB MASTER</h1>
                </div>
                <div class="space-y-2">
                    <button onclick="switchMode('deep-dive')" id="btn-deep-dive" class="w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium bg-indigo-600 text-white">
                        <i data-lucide="book-open"></i><span class="hidden md:inline">Deep Dive</span>
                    </button>
                    <button onclick="switchMode('flashcard')" id="btn-flashcard" class="w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900">
                        <i data-lucide="layers"></i><span class="hidden md:inline">Flashcard 3D</span>
                    </button>
                    <button onclick="switchMode('quiz')" id="btn-quiz" class="w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900">
                        <i data-lucide="award"></i><span class="hidden md:inline">Trắc nghiệm</span>
                    </button>
                    <button onclick="switchMode('block-blast')" id="btn-block-blast" class="w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900">
                        <i data-lucide="grid"></i><span class="hidden md:inline">Block Blast</span>
                    </button>
                </div>
            </div>
            <button onclick="switchMode('manage')" id="btn-manage" class="w-full flex items-center justify-center gap-2 p-2.5 border border-slate-800 rounded-xl text-xs font-semibold bg-slate-900 text-slate-300">
                <i data-lucide="plus-circle"></i><span class="hidden md:inline" id="lbl-count">Quản Lý</span>
            </button>
        </nav>

        <main id="main-content" class="flex-1 flex flex-col p-4 md:p-6 overflow-hidden bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950/30">
            </main>
    </div>

    <script>
        // DỮ LIỆU TỪ VỰNG GỐC CỦA BẠN
        const defaultVocab = [
          { id: 1, word: "tough", definitionVn: "Khó khăn, cứng rắn, bền bỉ", definitionEn: "Strong enough to withstand adverse conditions or rough handling", example: "The marathon was tough, but she finished it.", synonyms: "resilient, hard", antonyms: "weak, delicate", mnemonic: "Hãy nhớ đến 'thịt dai' (tough meat) cần sự bền bỉ để nhai!" },
          { id: 2, word: "segregation", definitionVn: "Sự phân biệt đối xử, sự chia tách", definitionEn: "The action or state of setting someone or something apart from others", example: "The civil rights movement fought against racial segregation.", synonyms: "separation, isolation", antonyms: "integration, unification", mnemonic: "Segregation có gốc 'segre-' nghĩa là tách biệt ra." },
          { id: 3, word: "lead the way", definitionVn: "Dẫn đường, tiên phong", definitionEn: "Go ahead of others to show the way or be a pioneer", example: "Our company aims to lead the way in green technology.", synonyms: "pioneer, guide", antonyms: "follow", mnemonic: "Lead (dẫn dắt) + The way (con đường) = Người mở đường." },
          { id: 4, word: "vulnerable", definitionVn: "Dễ bị tổn thương", definitionEn: "Susceptible to physical or emotional attack or harm", example: "Children are the most vulnerable members of society.", synonyms: "helpless, exposed", antonyms: "resilient, protected", mnemonic: "Vulnerable giống như một 'vết thương' dễ bị chạm vào." },
          { id: 5, word: "delicate", definitionVn: "Mỏng manh, tinh tế, dễ vỡ", definitionEn: "Very fine in texture or structure; easily broken or damaged", example: "The antique vase is extremely delicate.", synonyms: "fragile, subtle", antonyms: "tough, robust", mnemonic: "Đọc gần giống 'đẻ liền hai cái' -> rất mỏng manh và cần chăm sóc cân thận." },
          { id: 6, word: "resilient", definitionVn: "Kiên cường, có khả năng phục hồi nhanh", definitionEn: "Able to withstand or recover quickly from difficult conditions", example: "The local economy proved remarkably resilient.", synonyms: "tough, bouncy", antonyms: "vulnerable, fragile", mnemonic: "Re (lại) + silent (im lặng) -> Gặp biến cố chỉ im lặng rồi tự đứng dậy phục hồi." },
          { id: 7, word: "continuous collaboration", definitionVn: "Sự cộng tác liên tục", definitionEn: "The act of working together with someone constantly over time", example: "Success relies on continuous collaboration between teams.", synonyms: "constant teamwork", antonyms: "isolation", mnemonic: "Continuous (liên tục) + Collaboration (cộng tác)." },
          { id: 8, word: "collective", definitionVn: "Tập thể, chung", definitionEn: "Done by people acting as a group; referring to all members", example: "It was a collective decision by all board members.", synonyms: "joint, shared", antonyms: "individual", mnemonic: "Giống từ Collect (thu thập) -> gom lại thành một tập thể." },
          { id: 9, word: "detect", definitionVn: "Phát hiện, dò tìm", definitionEn: "Discover or identify the presence or existence of something", example: "The security system can detect any unauthorized entry.", synonyms: "discover, find", antonyms: "hide, ignore", mnemonic: "Thám tử (detective) là người đi 'detect' các manh mối." },
          { id: 10, word: "freeze", definitionVn: "Đóng băng", definitionEn: "Turn into ice or another solid as a result of extreme cold", example: "Water will freeze at 0 degrees Celsius.", synonyms: "solidify", antonyms: "melt", mnemonic: "Tủ đông trong nhà gọi là freezer." },
          { id: 11, word: "melt", definitionVn: "Tan chảy", definitionEn: "Make or become liquefied by heating", example: "The ice cream began to melt in the hot sun.", synonyms: "dissolve", antonyms: "freeze", mnemonic: "Melt khiến ta nghĩ đến kẹo chocolate 'tan chảy' trong miệng." },
          { id: 12, word: "condense", definitionVn: "Ngưng tụ, làm đặc lại", definitionEn: "Change from a gas to a liquid; express in fewer words", example: "Steam condenses into water when it cools down.", synonyms: "compress, thicken", antonyms: "evaporate", mnemonic: "Sữa đặc cô đặc thường gọi là 'condensed milk'." },
          { id: 13, word: "evaporate", definitionVn: "Bay hơi, bốc hơi", definitionEn: "Turn from liquid into vapor", example: "The puddles of water evaporate quickly under the sun.", synonyms: "vanish, vaporize", antonyms: "condense", mnemonic: "E- (ra ngoài) + vapor (hơi nước) -> hơi nước bay ra ngoài." },
          { id: 14, word: "concerning symptom", definitionVn: "Triệu chứng đáng lo ngại", definitionEn: "A physical or mental feature indicating a condition that causes anxiety", example: "A chronic cough is a concerning symptom that requires a doctor visit.", synonyms: "alarming sign", antonyms: "reassuring sign", mnemonic: "Concerning (đáng lo) + Symptom (triệu chứng bệnh)." },
          { id: 15, word: "thrive", definitionVn: "Phát triển thịnh vượng, khoẻ mạnh", definitionEn: "Grow or develop well or vigorously", example: "The plants thrive in this warm, sunny climate.", synonyms: "flourish, prosper", antonyms: "fail, wither", mnemonic: "Thrive nghe gần giống 'Strive' (phấn đấu) để 'thịnh vượng'." },
          { id: 16, word: "carry on", definitionVn: "Tiếp tục làm gì đó", definitionEn: "Continue an activity or task; keep doing something", example: "Please carry on with your work while I am away.", synonyms: "continue, keep doing", antonyms: "stop, quit", mnemonic: "Xách (carry) nó lên và đi tiếp (on) -> tiếp tục." },
          { id: 17, word: "check up on", definitionVn: "Kiểm tra xem ai đó đang làm đúng việc không", definitionEn: "Make sure that someone is doing what they should be doing", example: "My boss likes to check up on us every afternoon.", synonyms: "monitor, inspect", antonyms: "ignore", mnemonic: "Check (kiểm tra) + Up on (phía trên) -> giám sát từ trên xuống." },
          { id: 18, word: "keep one's fingers on the pulse", definitionVn: "Nắm bắt kịp thời tình hình/xu hướng", definitionEn: "Keep track of or remain aware of the latest trends or developments", example: "As a marketer, you must keep your fingers on the pulse.", synonyms: "keep track of, stay updated", antonyms: "out of touch", mnemonic: "Đặt tay lên mạch đập (pulse) để biết tim đập ra sao -> bắt kịp nhịp độ." },
          { id: 19, word: "assess", definitionVn: "Đánh giá, ước định", definitionEn: "Evaluate or estimate the nature, ability, or quality of", example: "We need to assess the risks before making a decision.", synonyms: "evaluate, appraise", antonyms: "guess", mnemonic: "Học sinh làm bài 'assignment' để giáo viên 'assess' (đánh giá)." },
          { id: 20, word: "insight", definitionVn: "Cái nhìn sâu sắc, sự hiểu biết thấu đáo", definitionEn: "A deep understanding of a person or thing", example: "The research provides valuable insight into consumer behavior.", synonyms: "understanding, perception", antonyms: "ignorance", mnemonic: "In (vào trong) + Sight (tầm nhìn) -> nhìn thấu vào bên trong bản chất." },
          { id: 21, word: "hand in hand", definitionVn: "Song hành, gắn liền với nhau", definitionEn: "Closely associated; together", example: "Wealth and power often go hand in hand.", synonyms: "together, jointly", antonyms: "separately", mnemonic: "Tay trong tay -> Luôn đi cùng nhau." },
          { id: 22, word: "indicator", definitionVn: "Chỉ số, dấu hiệu", definitionEn: "A trend or fact that indicates the state or level of something", example: "Economic growth is a key indicator of a country's health.", synonyms: "sign, signal", antonyms: "counter-evidence", mnemonic: "Xem kim chỉ mét ở xe máy/ô tô chính là các indicator." },
          { id: 23, word: "fluctuation", definitionVn: "Sự biến động, dao động", definitionEn: "An irregular rising and falling in number or amount", example: "The fluctuation in gold prices makes investors nervous.", synonyms: "variation, shift", antonyms: "stability, constancy", mnemonic: "Đọc giống 'phập phồng' -> lúc lên lúc xuống không ổn định." },
          { id: 24, word: "safeguard", definitionVn: "Bảo vệ, che chở", definitionEn: "Protect from harm or damage with an appropriate measure", example: "The law was passed to safeguard consumer rights.", synonyms: "protect, defend", antonyms: "endanger, imperil", mnemonic: "Safe (an toàn) + Guard (bảo vệ) -> lá chắn bảo vệ." },
          { id: 25, word: "cherish", definitionVn: "Trân trọng, yêu thương", definitionEn: "Hold something dear; treat with affection and tenderness", example: "I will always cherish the memories of our childhood.", synonyms: "treasure, value", antonyms: "neglect, despise", mnemonic: "Gần giống 'cherry' -> quả cherry ngọt ngào cần được nâng niu." },
          { id: 26, word: "symphony", definitionVn: "Bản nhạc giao hưởng", definitionEn: "An elaborate musical composition for full orchestra", example: "Beethoven's Fifth Symphony is globally famous.", synonyms: "harmony, orchestra", antonyms: "cacophony", mnemonic: "Sym (cùng nhau) + phony (âm thanh) -> phối hợp âm thanh lại." },
          { id: 27, word: "unify", definitionVn: "Thống nhất, hợp nhất", definitionEn: "Make or become united, uniform, or whole", example: "The new leader hopes to unify the split country.", synonyms: "unite, merge", antonyms: "divide, segregate", mnemonic: "Uni- có nghĩa là một (như trong từ uniform, universe)." },
          { id: 28, word: "remarkable", definitionVn: "Đáng chú ý, xuất sắc", definitionEn: "Worthy of attention; striking or extraordinary", example: "She has made a remarkable recovery from her illness.", synonyms: "extraordinary, outstanding", antonyms: "ordinary, average", mnemonic: "Remark (nhận xét) + able (có thể) -> xuất sắc tới mức ai cũng phải bàn tán." },
          { id: 29, word: "enhance", definitionVn: "Nâng cao, cải thiện", definitionEn: "Intensify, increase, or further improve the quality or value of", example: "You can enhance your skills by practicing every day.", synonyms: "improve, boost", antonyms: "worsen, diminish", mnemonic: "Thêm 'hương vị' (enhance) vào món ăn để làm nó ngon hơn." },
          { id: 30, word: "carbon footprint", definitionVn: "Vết carbon, lượng khí thải carbon", definitionEn: "The amount of carbon dioxide released into the atmosphere due to one's activities", example: "We can reduce our carbon footprint by cycling to work.", synonyms: "CO2 emission", antonyms: "eco-friendly score", mnemonic: "Dấu chân (footprint) làm bằng than khí thải để lại trên Trái Đất." },
          { id: 31, word: "processed foods", definitionVn: "Thực phẩm đóng hộp/đã qua chế biến", definitionEn: "Foods that have been altered from their natural state for safety or convenience", example: "Processed foods are often high in salt and preservatives.", synonyms: "packaged food", antonyms: "fresh foods", mnemonic: "Process (quy trình) + Foods -> thức ăn công nghiệp đi qua nhà máy." }
        ];

        let vocabList = JSON.parse(localStorage.getItem('custom_vocab_ios')) || defaultVocab;
        let currentMode = 'deep-dive';
        let currentIndex = 0;
        let isFlipped = false;

        // Lưu dữ liệu vào LocalStorage
        function saveToStorage() {
            localStorage.setItem('custom_vocab_ios', JSON.stringify(vocabList));
            document.getElementById('lbl-count').innerText = `Quản Lý (${vocabList.length})`;
        }

        // Chuyển Tab Chế Độ
        function switchMode(mode) {
            currentMode = mode;
            currentIndex = 0;
            isFlipped = false;

            // Đổi trạng thái active nút bấm sidebar
            ['deep-dive', 'flashcard', 'quiz', 'block-blast', 'manage'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium bg-indigo-600 text-white";
                } else {
                    btn.className = "w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-900";
                }
            });

            renderContent();
        }

        // RENDER NỘI DUNG TỪNG CHẾ ĐỘ CHƠI
        function renderContent() {
            const container = document.getElementById('main-content');
            
            if (vocabList.length === 0 && currentMode !== 'manage') {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-500"><i data-lucide="book-open" class="w-12 h-12 mb-2"></i><p>Danh sách từ vựng trống. Hãy vào tab Quản lý để thêm từ.</p></div>`;
                lucide.createIcons();
                return;
            }

            if (currentMode === 'deep-dive') {
                const cur = vocabList[currentIndex];
                container.innerHTML = `
                    <div class="h-full flex flex-col justify-between max-w-2xl mx-auto w-full">
                        <div class="flex-1 bg-slate-800/50 border border-slate-800 rounded-2xl p-5 overflow-y-auto space-y-4">
                            <div class="border-b border-slate-700/60 pb-3">
                                <h1 class="text-3xl font-extrabold text-white">${cur.word}</h1>
                                <p class="text-indigo-400 font-bold text-lg mt-1">${cur.definitionVn}</p>
                            </div>
                            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800"><span class="text-xs text-slate-400 font-bold uppercase block mb-1">Định nghĩa tiếng Anh</span><p class="text-sm">${cur.definitionEn}</p></div>
                            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800"><span class="text-xs text-amber-400 font-bold uppercase block mb-1">💡 Mẹo Tư Duy</span><p class="text-sm text-amber-100/90 italic">${cur.mnemonic}</p></div>
                            <div class="bg-indigo-950/40 p-4 rounded-xl border border-indigo-900/40"><span class="text-xs text-indigo-400 font-bold uppercase block mb-1">Ví Dụ Thực Tế</span><p class="font-medium text-slate-100">"${cur.example}"</p></div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-emerald-950/20 p-3 rounded-xl border border-emerald-900/20"><span class="text-xs text-emerald-400 font-bold block mb-1">Đồng nghĩa</span><p class="text-xs">${cur.synonyms}</p></div>
                                <div class="bg-rose-950/20 p-3 rounded-xl border border-rose-900/20"><span class="text-xs text-rose-400 font-bold block mb-1">Trái nghĩa</span><p class="text-xs">${cur.antonyms}</p></div>
                            </div>
                        </div>
                        <div class="flex gap-4 mt-4">
                            <button onclick="changeIndex(-1)" ${currentIndex === 0 ? 'disabled' : ''} class="flex-1 bg-slate-800 p-3.5 rounded-xl font-bold disabled:opacity-30">TRƯỚC</button>
                            <button onclick="changeIndex(1)" ${currentIndex === vocabList.length - 1 ? 'disabled' : ''} class="flex-1 bg-indigo-600 p-3.5 rounded-xl font-bold disabled:opacity-30">TIẾP THEO</button>
                        </div>
                    </div>`;
            } 
            
            else if (currentMode === 'flashcard') {
                const cur = vocabList[currentIndex];
                container.innerHTML = `
                    <div class="h-full flex flex-col justify-between max-w-md mx-auto w-full">
                        <div class="flex-1 cursor-pointer perspective-1000 my-4" onclick="toggleFlashcard()">
                            <div id="card-inner" class="relative w-full h-full transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}">
                                <div class="absolute inset-0 backface-hidden bg-gradient-to-b from-indigo-900 to-slate-800 border-2 border-indigo-500/30 rounded-3xl flex flex-col items-center justify-center p-6 text-center">
                                    <h1 class="text-4xl font-black text-white">${cur.word}</h1>
                                    <p class="text-xs text-slate-400 mt-4">Chạm để lật xem nghĩa</p>
                                </div>
                                <div class="absolute inset-0 backface-hidden rotate-y-180 bg-slate-800 border-2 border-emerald-500/30 rounded-3xl flex flex-col items-center justify-center p-6 text-center">
                                    <h2 class="text-2xl font-bold text-emerald-400">${cur.definitionVn}</h2>
                                    <p class="text-sm text-slate-300 italic mt-3">"${cur.definitionEn}"</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="changeFlashcardIndex(-1)" class="flex-1 bg-slate-800 p-3 rounded-xl font-bold text-xs">TRƯỚC</button>
                            <button onclick="changeFlashcardIndex(1)" class="flex-1 bg-indigo-600 p-3 rounded-xl font-bold text-xs">KẾ TIẾP</button>
                        </div>
                    </div>`;
            } 
            
            else if (currentMode === 'quiz') {
                initQuizModule(container);
            } 
            
            else if (currentMode === 'block-blast') {
                initBlockBlastModule(container);
            } 
            
            else if (currentMode === 'manage') {
                let rowsHtml = '';
                vocabList.forEach(v => {
                    rowsHtml += `
                        <tr class="border-b border-slate-800 hover:bg-slate-800/10">
                            <td class="p-2.5 font-bold text-white">${v.word}</td>
                            <td class="p-2.5 text-slate-300">${v.definitionVn}</td>
                            <td class="p-2.5 text-right"><button onclick="deleteWord(${v.id})" class="text-rose-400 font-bold px-2">Xóa</button></td>
                        </tr>`;
                });

                container.innerHTML = `
                    <div class="h-full flex flex-col w-full max-w-2xl mx-auto overflow-hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4 shrink-0">
                            <div class="bg-slate-800/40 p-3 border border-slate-800 rounded-xl">
                                <input type="text" id="txt-single" placeholder="Nhập từ English..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs mb-2 text-white" />
                                <button onclick="addSingleWord()" class="w-full bg-indigo-600 py-1.5 rounded-lg text-xs font-bold">THÊM 1 TỪ</button>
                            </div>
                            <div class="bg-slate-800/40 p-3 border border-slate-800 rounded-xl">
                                <textarea id="txt-bulk" rows="1" placeholder="Từ 1, Từ 2, Từ 3..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs mb-2 text-white resize-none"></textarea>
                                <button onclick="addBulkWords()" class="w-full bg-emerald-600 py-1.5 rounded-lg text-xs font-bold">THÊM HÀNG LOẠT</button>
                            </div>
                        </div>
                        <div class="flex-1 bg-slate-800/20 border border-slate-800 rounded-xl overflow-y-auto">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead class="bg-slate-950 sticky top-0 text-slate-400 font-bold">
                                    <tr><th class="p-2.5">Từ vựng</th><th class="p-2.5">Định nghĩa Việt</th><th class="p-2.5 text-right">Xóa</th></tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>`;
            }

            lucide.createIcons();
        }

        // --- CÁC HÀM XỬ LÝ SỰ KIỆN CHO DEEP DIVE & FLASHCARD ---
        function changeIndex(dir) {
            currentIndex += dir;
            renderContent();
        }
        function toggleFlashcard() {
            isFlipped = !isFlipped;
            document.getElementById('card-inner').classList.toggle('rotate-y-180', isFlipped);
        }
        function changeFlashcardIndex(dir) {
            isFlipped = false;
            currentIndex = (currentIndex + dir + vocabList.length) % vocabList.length;
            renderContent();
        }

        // --- HÀM XỬ LÝ CHẾ ĐỘ QUẢN LÝ TỪ VỰNG ---
        function addSingleWord() {
            const input = document.getElementById('txt-single');
            if(!input.value.trim()) return;
            vocabList.unshift({
                id: Date.now(),
                word: input.value.trim(),
                definitionVn: "Đã tạo tự động - Hãy cập nhật nghĩa",
                definitionEn: "Auto generated definition", example: "Auto generated example", synonyms: "N/A", antonyms: "N/A", mnemonic: "Tự tạo mẹo nhớ từ"
            });
            input.value = '';
            saveToStorage();
            renderContent();
        }
        function addBulkWords() {
            const textarea = document.getElementById('txt-bulk');
            if(!textarea.value.trim()) return;
            const words = textarea.value.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);
            words.forEach(w => {
                vocabList.unshift({
                    id: Date.now() + Math.random(),
                    word: w, definitionVn: "Đã tạo tự động", definitionEn: "Auto generated definition", example: "Auto generated example", synonyms: "N/A", antonyms: "N/A", mnemonic: "Tự tạo mẹo nhớ"
                });
            });
            textarea.value = '';
            saveToStorage();
            renderContent();
        }
        function deleteWord(id) {
            vocabList = vocabList.filter(v => v.id !== id);
            saveToStorage();
            renderContent();
        }

        // --- MODULE TRẮC NGHIỆM (QUIZ) ---
        let quizQuestions = [];
        let currentQuizIdx = 0;
        let quizScore = 0;
        let quizSelected = false;

        function initQuizModule(container) {
            if (vocabList.length < 4) {
                container.innerHTML = `<div class="text-center p-8 text-slate-500">Cần tối thiểu 4 từ vựng trong danh sách để tạo bài kiểm tra.</div>`;
                return;
            }
            // Tạo 10 câu ngẫu nhiên
            const shuffled = [...vocabList].sort(() => 0.5 - Math.random()).slice(0, 10);
            quizQuestions = shuffled.map(item => {
                const wrongs = vocabList.filter(v => v.id !== item.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                const options = [...wrongs, item].sort(() => 0.5 - Math.random());
                return { question: item.definitionVn, correct: item.word, options };
            });
            currentQuizIdx = 0; quizScore = 0; quizSelected = false;
            renderQuizQuestion(container);
        }

        function renderQuizQuestion(container) {
            if (currentQuizIdx >= quizQuestions.length) {
                container.innerHTML = `
                    <div class="max-w-md mx-auto text-center py-8 bg-slate-800/40 p-6 border border-slate-800 rounded-2xl">
                        <h2 class="text-2xl font-black text-white">HOÀN THÀNH</h2>
                        <div class="text-4xl font-extrabold text-indigo-400 my-4">${quizScore} / ${quizQuestions.length}</div>
                        <button onclick="switchMode('quiz')" class="w-full bg-indigo-600 py-3 rounded-xl font-bold">LÀM LẠI BÀI MỚI</button>
                    </div>`;
                return;
            }
            quizSelected = false;
            const q = quizQuestions[currentQuizIdx];
            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                optionsHtml += `<button onclick="checkQuizAnswer(this, '${opt.word}', '${q.correct}')" class="quiz-opt-btn p-3.5 border border-slate-700 bg-slate-800 text-left rounded-xl text-sm font-medium hover:bg-slate-700 transition-all text-white">${opt.word}</button>`;
            });

            container.innerHTML = `
                <div class="max-w-xl mx-auto w-full h-full flex flex-col justify-center">
                    <div class="flex justify-between text-xs text-slate-400 mb-2"><span>Câu ${currentQuizIdx + 1}/${quizQuestions.length}</span><span>Điểm: ${quizScore}</span></div>
                    <div class="bg-slate-800/80 border border-slate-700 p-6 rounded-2xl text-center mb-4 font-bold text-lg text-white">${q.question}</div>
                    <div class="grid grid-cols-1 gap-2">${optionsHtml}</div>
                </div>`;
        }

        function checkQuizAnswer(btn, selected, correct) {
            if(quizSelected) return;
            quizSelected = true;
            
            const buttons = document.querySelectorAll('.quiz-opt-btn');
            buttons.forEach(b => {
                if(b.innerText === correct) b.className = "p-3.5 border border-emerald-500 bg-emerald-600 rounded-xl text-sm font-medium text-white text-left w-full";
                else if(b === btn && selected !== correct) b.className = "p-3.5 border border-rose-500 bg-rose-600 rounded-xl text-sm font-medium text-white text-left w-full";
                else b.className = "p-3.5 border border-slate-800 bg-slate-800/40 rounded-xl text-sm font-medium text-slate-600 text-left w-full opacity-40";
            });

            if(selected === correct) quizScore++;
            setTimeout(() => {
                currentQuizIdx++;
                renderQuizQuestion(document.getElementById('main-content'));
            }, 1100);
        }

        // --- MODULE GAME (BLOCK BLAST) ---
        let gameBlocks = [];
        let selectedBlock = null;
        let gameScore = 0;

        function initBlockBlastModule(container) {
            if(vocabList.length < 5) {
                container.innerHTML = `<div class="text-center p-8 text-slate-500">Cần ít nhất 5 từ vựng để chơi minigame phá khối.</div>`;
                return;
            }
            const selected = [...vocabList].sort(() => 0.5 - Math.random()).slice(0, 6);
            gameBlocks = [];
            selected.forEach(item => {
                gameBlocks.push({ id: `w-${item.id}`, matchId: item.id, val: item.word, type: 'word' });
                gameBlocks.push({ id: `d-${item.id}`, matchId: item.id, val: item.definitionVn, type: 'def' });
            });
            gameBlocks.sort(() => 0.5 - Math.random());
            gameScore = 0; selectedBlock = null;
            renderGameBoard(container);
        }

        function renderGameBoard(container) {
            if (gameBlocks.length === 0) {
                container.innerHTML = `
                    <div class="text-center max-w-sm mx-auto bg-slate-800/50 p-6 rounded-2xl border border-slate-800">
                        <h3 class="text-xl font-bold mb-1 text-white">Chiến Thắng! 🎉</h3>
                        <p class="text-slate-400 text-xs mb-4">Bạn đã dọn sạch toàn bộ ma trận khối.</p>
                        <button onclick="switchMode('block-blast')" class="bg-cyan-600 px-5 py-2.5 rounded-xl text-xs font-bold text-white">CHƠI LẠI VÒNG MỚI</button>
                    </div>`;
                return;
            }

            let gridHtml = '';
            gameBlocks.forEach(b => {
                let style = "bg-slate-800 border-slate-700 text-slate-200";
                if(selectedBlock && selectedBlock.id === b.id) {
                    style = "bg-indigo-600 border-indigo-400 text-white scale-105 ring-2 ring-indigo-400";
                }
                gridHtml += `<button id="block-${b.id}" onclick="handleBlockSelect('${b.id}')" class="h-16 p-2 border rounded-xl text-xs font-semibold text-center transition-all overflow-hidden ${style}">${b.val}</button>`;
            });

            container.innerHTML = `
                <div class="max-w-xl mx-auto w-full h-full flex flex-col justify-between">
                    <div class="flex justify-between items-center mb-2"><span class="text-cyan-400 font-bold text-sm">ĐIỂM SỐ: ${gameScore}</span><button onclick="switchMode('block-blast')" class="text-xs bg-slate-800 border border-slate-700 text-slate-300 px-3 py-1 rounded-lg">Làm mới</button></div>
                    <div class="flex-1 flex items-center justify-center"><div class="grid grid-cols-2 sm:grid-cols-3 gap-2 w-full max-h-[72vh] overflow-y-auto">${gridHtml}</div></div>
                </div>`;
        }

        function handleBlockSelect(id) {
            const block = gameBlocks.find(x => x.id === id);
            const element = document.getElementById(`block-${id}`);

            if (!selectedBlock) {
                selectedBlock = block;
                renderGameBoard(document.getElementById('main-content'));
                return;
            }

            if (selectedBlock.id === block.id) {
                selectedBlock = null;
                renderGameBoard(document.getElementById('main-content'));
                return;
            }

            if (selectedBlock.matchId === block.matchId && selectedBlock.type !== block.type) {
                // Đúng cặp -> phá khối
                gameScore += 20;
                gameBlocks = gameBlocks.filter(x => x.matchId !== block.matchId);
                selectedBlock = null;
                renderGameBoard(document.getElementById('main-content'));
            } else {
                // Sai cặp -> Đổi màu đỏ + hiệu ứng rung lắc
                gameScore = Math.max(0, gameScore - 5);
                const firstElement = document.getElementById(`block-${selectedBlock.id}`);
                
                if (firstElement) firstElement.className = "h-16 p-2 border border-rose-400 bg-rose-600 text-white rounded-xl text-xs font-semibold text-center animate-shake";
                if (element) element.className = "h-16 p-2 border border-rose-400 bg-rose-600 text-white rounded-xl text-xs font-semibold text-center animate-shake";
                
                selectedBlock = null;
                setTimeout(() => {
                    renderGameBoard(document.getElementById('main-content'));
                }, 450);
            }
        }

        // Khởi động ứng dụng ngay khi load trang
        saveToStorage();
        switchMode('deep-dive');
    </script>
</body>
</html>
