<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master - Web App Học Từ Vựng</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* CSS bổ trợ hiệu ứng 3D cho Flashcard & hiệu ứng Game */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out infinite; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 6s linear infinite; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased overflow-hidden m-0 p-0">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Dataset từ vựng của bạn
        const initialVocabulary = [
          { id: 1, word: "tough", definitionVn: "Khó khăn, cứng rắn, bền bỉ", definitionEn: "Strong enough to withstand adverse conditions or rough handling", example: "The marathon was tough, but she finished it.", synonyms: "resilient, hard", antonyms: "weak, delicate", mnemonic: "Hãy nhớ đến 'thịt dai' (tough meat) cần sự bền bỉ để nhai!" },
          { id: 2, word: "segregation", definitionVn: "Sự phân biệt đối xử, sự chia tách", definitionEn: "The action or state of setting someone or something apart from others", example: "The civil rights movement fought against racial segregation.", synonyms: "separation, isolation", antonyms: "integration, unification", mnemonic: "Segregation có gốc 'segre-' nghĩa là tách biệt ra." },
          { id: 3, word: "lead the way", definitionVn: "Dẫn đường, tiên phong", definitionEn: "Go ahead of others to show the way or be a pioneer", example: "Our company aims to lead the way in green technology.", synonyms: "pioneer, guide", antonyms: "follow", mnemonic: "Lead (dẫn dắt) + The way (con đường) = Người mở đường." },
          { id: 4, word: "vulnerable", definitionVn: "Dễ bị tổn thương", definitionEn: "Susceptible to physical or emotional attack or harm", example: "Children are the most vulnerable members of society.", synonyms: "helpless, exposed", antonyms: "resilient, protected", mnemonic: "Vulnerable giống như một 'vết thương' dễ bị chạm vào." },
          { id: 5, word: "delicate", definitionVn: "Mỏng manh, tinh tế, dễ vỡ", definitionEn: "Very fine in texture or structure; easily broken or damaged", example: "The antique vase is extremely delicate.", synonyms: "fragile, subtle", antonyms: "tough, robust", mnemonic: "Đọc gần giống 'đẻ liền hai cái' -> rất mỏng manh và cần chăm sóc cẩn thận." },
          { id: 6, word: "resilient", definitionVn: "Kiên cường, có khả năng phục hồi nhanh", definitionEn: "Able to withstand or recover quickly from difficult conditions", example: "The local economy proved remarkably resilient.", synonyms: "tough, bouncy", antonyms: "vulnerable, fragile", mnemonic: "Re (lại) + silent (im lặng) -> Gặp biến cố chỉ im lặng rồi tự đứng dậy phục hồi." },
          { id: 7, word: "continuous collaboration", definitionVn: "Sự cộng tác liên tục", definitionEn: "The act of working together with someone constantly over time", example: "Success relies on continuous collaboration between teams.", synonyms: "constant teamwork", antonyms: "isolation", mnemonic: "Continuous (liên tục) + Collaboration (cộng tác)." },
          { id: 8, word: "collective", definitionVn: "Tập thể, chung", definitionEn: "Done by people acting as a group; referring to all members", example: "It was a collective decision by all board members.", synonyms: "joint, shared", antonyms: "individual", mnemonic: "Giống từ Collect (thu thập) -> gom lại thành một tập thể." },
          { id: 9, word: "detect", definitionVn: "Phát hiện, dò tìm", definitionEn: "Discover or identify the presence or existence of something", example: "The security system can detect any unauthorized entry.", synonyms: "discover, find", antonyms: "hide, ignore", mnemonic: "Thám tử (detective) là người đi 'detect' các manh mối." },
          { id: 10, word: "freeze", definitionVn: "Đóng băng", definitionEn: "Turn into ice or another solid as a result of extreme cold", example: "Water will freeze at 0 degrees Celsius.", synonyms: "solidify", antonyms: "melt", mnemonic: "Tủ đông trong nhà gọi là freezer." },
          { id: 11, word: "melt", definitionVn: "Tan chảy", definitionEn: "Make or become liquefied by heating", example: "The ice cream began to melt in the hot sun.", synonyms: "dissolve", antonyms: "freeze", mnemonic: "Melt khiến ta nghĩ đến kẹo chocolate 'tan chảy' trong miệng." },
          { id: 12, word: "condense", definitionVn: "Ngưng tụ, làm đặc lại", definitionEn: "Change from a gas to a liquid; express in fewer words", example: "Steam condenses into water when it cools down.", synonyms: "compress, thicken", antonyms: "evaporate", mnemonic: "Sữa đặc cô đặc thường gọi là 'condensed milk'." },
          { id: 13, word: "evaporate", definitionVn: "Bay hơi, bốc hơi", definitionEn: "Turn from liquid into vapor", example: "The puddles of water evaporate quickly under the sun.", synonyms: "vanish, vaporize", antonyms: "condense", mnemonic: "E- (ra ngoài) + vapor (hơi nước) -> hơi nước bay ra ngoài." },
          { id: 14, word: "concerning symptom", definitionVn: "Triệu chứng đáng lo ngại", definitionEn: "A physical or mental feature indicating a condition that causes anxiety", example: "A chronic cough is a concerning symptom that requires a doctor visit.", synonyms: "alarming sign", antonyms: "reassuring sign", mnemonic: "Concerning (đáng lo) + Symptom (triệu chứng bệnh)." },
          { id: 15, word: "thrive", definitionVn: "Phát triển thịnh vượng, khoẻ mạnh", definitionEn: "Grow or develop well or vigorously", example: "The plants thrive in this warm, sunny climate.", synonyms: "flourish, prosper", antonyms: "fail, wither", mnemonic: "Thrive nghe gần giống 'Strive' (phấn đấu) để 'thịnh vượng'." },
          { id: 16, word: "carry on", definitionVn: "Tiếp tục làm gì đó", definitionEn: "Continue an activity or task; keep doing something", example: "Please carry on with your work while I am away.", synonyms: "continue, keep doing", antonyms: "stop, quit", mnemonic: "Xách (carry) nó lên và đi tiếp (on) -> tiếp tục." },
          { id: 17, word: "check up on", definitionVn: "Kiểm tra xem ai đó đang làm đúng việc không", definitionEn: "Make sure that someone is doing what they should be doing", example: "My boss likes to check up on us every afternoon.", synonyms: "monitor, inspect", antonyms: "ignore", mnemonic: "Check (kiểm tra) + Up on (phía trên) -> giám sát từ trên xuống." },
          { id: 18, word: "keep one's fingers on the pulse", definitionVn: "Nắm bắt kịp thời tình hình/xu hướng", definitionEn: "Keep track of or remain aware of the latest trends or developments", example: "As a marketer, you must keep your fingers on the pulse.", synonyms: "keep track of, stay updated", antonyms: "out of touch", mnemonic: "Đặt tay lên mạch đập (pulse) để biết tim đập ra sao -> bắt kịp nhịp độ." },
          { id: 19, word: "assess", definitionVn: "Đánh giá, ước định", definitionEn: "Evaluate or estimate the nature, ability, or quality of", example: "We need to assess the risks before making a decision.", synonyms: "evaluate, appraise", antonyms: "guess", mnemonic: "Học sinh làm bài 'assignment' để giáo viên 'assess' (đánh giá)." },
          { id: 20, word: "insight", definitionVn: "Cái nhìn sâu sắc, sự hiểu biết thấu đáo", definitionEn: "A deep understanding of a person or thing", example: "The research provides valuable insight into consumer behavior.", synonyms: "understanding, perception", antonyms: "ignorance", mnemonic: "In (vào trong) + Sight (tầm nhìn) -> nhìn thấu vào bên trong bản chất." },
          { id: 21, word: "hand in hand", definitionVn: "Song hành, gắn liền với nhau", definitionEn: "Closely associated; together", example: "Wealth and power often go hand in hand.", synonyms: "together, jointly", antonyms: "separately", mnemonic: "Tay trong tay -> Luôn đi cùng nhau." },
          { id: 22, word: "indicator", definitionVn: "Chỉ số, dấu hiệu", definitionEn: "A trend or fact that indicates the state or level of something", example: "Economic growth is a key indicator of a country's health.", synonyms: "sign, signal", antonyms: "counter-evidence", mnemonic: "Xem kim chỉ mét ở xe máy/ô tô chính là các indicator." },
          { id: 23, word: "fluctuation", definitionVn: "Sự biến động, dao động", definitionEn: "An irregular rising and falling in number or amount", example: "The fluctuation in gold prices makes investors nervous.", synonyms: "variation, shift", antonyms: "stability, constancy", mnemonic: "Đọc giống 'phập phồng' -> lúc lên lúc xuống không ổn định." },
          { id: 24, word: "safeguard", definitionVn: "Bảo vệ, che chở", definitionEn: "Protect from harm or damage with an appropriate measure", example: "The law was passed to safeguard consumer rights.", synonyms: "protect, defend", antonyms: "endanger, imperil", mnemonic: "Safe (an toàn) + Guard (bảo vệ) -> lá chắn bảo vệ." },
          { id: 25, word: "cherish", definitionVn: "Trân trọng, yêu thương", definitionEn: "Hold something dear; treat with affection and tenderness", example: "I will always cherish the memories of our childhood.", synonyms: "treasure, value", antonyms: "neglect, despise", mnemonic: "Gần giống 'cherry' -> quả cherry ngọt ngào cần được nâng niu." },
          { id: 26, word: "symphony", definitionVn: "Bản nhạc giao hưởng", definitionEn: "An elaborate musical composition for full orchestra", example: "Beethoven's Fifth Symphony is globally famous.", synonyms: "harmony, orchestra", antonyms: "cacophony", mnemonic: "Sym (cùng nhau) + phony (âm thanh) -> phối hợp âm thanh lại." },
          { id: 27, word: "unify", definitionVn: "Thống nhất, hợp nhất", definitionEn: "Make or become united, uniform, or whole", example: "The new leader hopes to unify the split country.", synonyms: "unite, merge", antonyms: "divide, segregate", mnemonic: "Uni- có nghĩa là một (như trong từ uniform, universe)." },
          { id: 28, word: "remarkable", definitionVn: "Đáng chú ý, xuất sắc", definitionEn: "Worthy of attention; striking or extraordinary", example: "She has made a remarkable recovery from her illness.", synonyms: "extraordinary, outstanding", antonyms: "ordinary, average", mnemonic: "Remark (nhận xét) + able (có thể) -> xuất sắc tới mức ai cũng phải bàn tán." },
          { id: 29, word: "enhance", definitionVn: "Nâng cao, cải thiện", definitionEn: "Intensify, increase, or further improve the quality or value of", example: "You can enhance your skills by practicing every day.", synonyms: "improve, boost", antonyms: "worsen, diminish", mnemonic: "Thêm 'hương vị' (enhance) vào món ăn để làm nó ngon hơn." },
          { id: 30, word: "carbon footprint", definitionVn: "Vết carbon, lượng khí thải carbon", definitionEn: "The amount of carbon dioxide released into the atmosphere due to one's activities", example: "We can reduce our carbon footprint by cycling to work.", synonyms: "CO2 emission", antonyms: "eco-friendly score", mnemonic: "Dấu chân (footprint) làm bằng than khí thải để lại trên Trái Đất." },
          { id: 31, word: "processed foods", definitionVn: "Thực phẩm đóng hộp/đã qua chế biến", definitionEn: "Foods that have been altered from their natural state for safety or convenience", example: "Processed foods are often high in salt and preservatives.", synonyms: "packaged food", antonyms: "fresh foods", mnemonic: "Process (quy trình) + Foods -> thức ăn công nghiệp đi qua nhà máy." }
        ];

        const autoGenerateData = (word) => ({
          id: Date.now() + Math.random(),
          word: word.trim(),
          definitionVn: "Đã thêm từ iOS - Hãy sửa nghĩa",
          definitionEn: `Meaning related to ${word.trim()}`,
          example: `Example for ${word.trim()}`,
          synonyms: "N/A",
          antonyms: "N/A",
          mnemonic: "Tự tạo mẹo nhớ từ này!"
        });

        function App() {
          const [vocabList, setVocabList] = useState(() => {
            const saved = localStorage.getItem('custom_vocab');
            return saved ? JSON.parse(saved) : initialVocabulary;
          });
          const [currentMode, setCurrentMode] = useState('deep-dive');
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isFlipped, setIsFlipped] = useState(false);

          useEffect(() => {
            localStorage.setItem('custom_vocab', JSON.stringify(vocabList));
          }, [vocabList]);

          useEffect(() => {
            setCurrentIndex(0);
            setIsFlipped(false);
          }, [currentMode]);

          return (
            <div className="w-screen h-screen flex bg-slate-900 text-slate-100 overflow-hidden font-sans">
              {/* SIDEBAR */}
              <nav className="w-16 md:w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between p-2 md:p-4 shrink-0">
                <div>
                  <div className="flex items-center gap-3 py-4 mb-4 border-b border-slate-800 justify-center md:justify-start">
                    <i data-lucide="sparkles" class="text-indigo-400 w-6 h-6 md:w-8 md:h-8"></i>
                    <h1 className="hidden md:block font-black text-lg tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">VOCAB MASTER</h1>
                  </div>
                  <div className="space-y-2">
                    <button onClick={() => setCurrentMode('deep-dive')} className={`w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium ${currentMode === 'deep-dive' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-900'}`}>
                      <i data-lucide="book-open"></i><span className="hidden md:inline">Deep Dive</span>
                    </button>
                    <button onClick={() => setCurrentMode('flashcard')} className={`w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium ${currentMode === 'flashcard' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-900'}`}>
                      <i data-lucide="layers"></i><span className="hidden md:inline">Flashcard 3D</span>
                    </button>
                    <button onClick={() => setCurrentMode('quiz')} className={`w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium ${currentMode === 'quiz' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-900'}`}>
                      <i data-lucide="award"></i><span className="hidden md:inline">Trắc nghiệm</span>
                    </button>
                    <button onClick={() => setCurrentMode('block-blast')} className={`w-full flex items-center justify-center md:justify-start gap-3 p-3 rounded-xl text-sm font-medium ${currentMode === 'block-blast' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-900'}`}>
                      <i data-lucide="grid"></i><span className="hidden md:inline">Block Blast</span>
                    </button>
                  </div>
                </div>
                <button onClick={() => setCurrentMode('manage')} className={`w-full flex items-center justify-center gap-2 p-2.5 border border-slate-800 rounded-xl text-xs font-semibold ${currentMode === 'manage' ? 'bg-cyan-600 text-white' : 'bg-slate-900 text-slate-300'}`}>
                  <i data-lucide="plus-circle"></i><span className="hidden md:inline">Quản Lý ({vocabList.length})</span>
                </button>
              </nav>

              {/* MAIN CONTENT */}
              <main className="flex-1 flex flex-col p-4 md:p-6 overflow-hidden bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950/30">
                {currentMode === 'deep-dive' && <DeepDive vocabList={vocabList} index={currentIndex} setIndex={setCurrentIndex} />}
                {currentMode === 'flashcard' && <Flashcard vocabList={vocabList} index={currentIndex} setIndex={setCurrentIndex} isFlipped={isFlipped} setIsFlipped={setIsFlipped} />}
                {currentMode === 'quiz' && <Quiz vocabList={vocabList} />}
                {currentMode === 'block-blast' && <BlockBlast vocabList={vocabList} />}
                {currentMode === 'manage' && <Manage vocabList={vocabList} setVocabList={setVocabList} />}
              </main>
            </div>
          );
        }

        // --- SUB COMPONENTS CƠ BẢN ---
        function DeepDive({ vocabList, index, setIndex }) {
          if (vocabList.length === 0) return <div className="text-center p-8 text-slate-500">Trống</div>;
          const current = vocabList[index];
          return (
            <div className="h-full flex flex-col justify-between max-w-3xl mx-auto w-full">
              <div className="flex-1 bg-slate-800/50 border border-slate-800 rounded-2xl p-6 overflow-y-auto space-y-4">
                <div className="border-b border-slate-800 pb-3">
                  <h1 className="text-3xl font-extrabold text-white">{current.word}</h1>
                  <p className="text-indigo-400 font-bold text-lg mt-1">{current.definitionVn}</p>
                </div>
                <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800"><span className="text-xs text-slate-400 block mb-1 font-bold uppercase">English Definition</span><p className="text-sm">{current.definitionEn}</p></div>
                <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-800"><span className="text-xs text-amber-400 block mb-1 font-bold uppercase">💡 Mẹo Nhớ</span><p className="text-sm text-amber-100 italic">{current.mnemonic}</p></div>
                <div className="bg-indigo-950/40 p-4 rounded-xl border border-indigo-900/50"><span className="text-xs text-indigo-400 block mb-1 font-bold uppercase">Ví Dụ</span><p className="font-medium">"{current.example}"</p></div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-emerald-950/20 p-3 rounded-xl border border-emerald-900/30"><span className="text-xs text-emerald-400 font-bold block mb-1">Đồng nghĩa</span><p className="text-xs text-slate-300">{current.synonyms}</p></div>
                  <div className="bg-rose-950/20 p-3 rounded-xl border border-rose-900/30"><span className="text-xs text-rose-400 font-bold block mb-1">Trái nghĩa</span><p className="text-xs text-slate-300">{current.antonyms}</p></div>
                </div>
              </div>
              <div className="flex gap-4 mt-4">
                <button disabled={index === 0} onClick={() => setIndex(prev => prev - 1)} className="flex-1 bg-slate-800 p-3 rounded-xl font-bold disabled:opacity-30">TRƯỚC</button>
                <button disabled={index === vocabList.length - 1} onClick={() => setIndex(prev => prev + 1)} className="flex-1 bg-indigo-600 p-3 rounded-xl font-bold disabled:opacity-30">TIẾP</button>
              </div>
            </div>
          );
        }

        function Flashcard({ vocabList, index, setIndex, isFlipped, setIsFlipped }) {
          if (vocabList.length === 0) return <div className="text-center p-8 text-slate-500">Trống</div>;
          const current = vocabList[index];
          return (
            <div className="h-full flex flex-col justify-between max-w-md mx-auto w-full">
              <div className="flex-1 cursor-pointer perspective-1000 my-4" onClick={() => setIsFlipped(!isFlipped)}>
                <div className={`relative w-full h-full transition-transform duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                  <div className="absolute inset-0 backface-hidden bg-gradient-to-b from-indigo-900 to-slate-800 border-2 border-indigo-500/30 rounded-3xl flex flex-col items-center justify-center p-6 text-center">
                    <h1 className="text-4xl font-black text-white">{current.word}</h1>
                    <p className="text-xs text-slate-400 mt-4">Chạm để lật mặt sau</p>
                  </div>
                  <div className="absolute inset-0 backface-hidden rotate-y-180 bg-slate-800 border-2 border-emerald-500/30 rounded-3xl flex flex-col items-center justify-center p-6 text-center">
                    <h2 className="text-2xl font-bold text-emerald-400">{current.definitionVn}</h2>
                    <p className="text-sm text-slate-300 italic mt-3 px-2">"{current.definitionEn}"</p>
                  </div>
                </div>
              </div>
              <div className="flex gap-3">
                <button onClick={() => { setIsFlipped(false); setIndex(prev => Math.max(0, prev - 1)); }} className="flex-1 bg-slate-800 p-3 rounded-xl text-xs font-bold">TRƯỚC</button>
                <button onClick={() => { setIsFlipped(false); setIndex(prev => Math.min(vocabList.length - 1, prev + 1)); }} className="flex-1 bg-indigo-600 p-3 rounded-xl text-xs font-bold">KẾ TIẾP</button>
              </div>
            </div>
          );
        }

        function Quiz({ vocabList }) {
          if (vocabList.length < 4) return <div className="text-center p-8 text-slate-500">Cần ít nhất 4 từ để chơi trắc nghiệm.</div>;
          const [quizData, setQuizData] = useState([]);
          const [currentIdx, setCurrentIdx] = useState(0);
          const [selectedAns, setSelectedAns] = useState(null);
          const [score, setScore] = useState(0);
          const [isFinished, setIsFinished] = useState(false);

          const generateQuiz = () => {
            const shuffled = [...vocabList].sort(() => 0.5 - Math.random()).slice(0, 10);
            const questions = shuffled.map(item => {
              const wrongs = vocabList.filter(v => v.id !== item.id).sort(() => 0.5 - Math.random()).slice(0, 3);
              const options = [...wrongs, item].sort(() => 0.5 - Math.random());
              return { question: item.definitionVn, correct: item.word, options };
            });
            setQuizData(questions); setCurrentIdx(0); setSelectedAns(null); setScore(0); setIsFinished(false);
          };

          useEffect(() => { generateQuiz(); }, [vocabList]);
          if (quizData.length === 0) return null;

          if (isFinished) {
            return (
              <div className="max-w-md mx-auto text-center py-8 bg-slate-800/40 p-6 border border-slate-800 rounded-2xl">
                <h2 className="text-2xl font-black text-white">HOÀN THÀNH</h2>
                <div className="text-4xl font-extrabold text-indigo-400 my-4">{score} / {quizData.length}</div>
                <button onClick={generateQuiz} className="w-full bg-indigo-600 py-3 rounded-xl font-bold">LÀM LẠI</button>
              </div>
            );
          }

          const currentQuiz = quizData[currentIdx];
          const handleAnswer = (word) => {
            if (selectedAns !== null) return;
            setSelectedAns(word);
            if (word === currentQuiz.correct) setScore(s => s + 1);
            setTimeout(() => {
              if (currentIdx < quizData.length - 1) { setCurrentIdx(c => c + 1); setSelectedAns(null); }
              else { setIsFinished(true); }
            }, 1000);
          };

          return (
            <div className="max-w-xl mx-auto w-full h-full flex flex-col justify-center">
              <div className="bg-slate-800/80 border border-slate-700 p-6 rounded-xl text-center mb-4">
                <h2 className="text-lg font-bold">{currentQuiz.question}</h2>
              </div>
              <div className="grid grid-cols-1 gap-2">
                {currentQuiz.options.map((opt, i) => {
                  let style = "bg-slate-800 border-slate-700 hover:bg-slate-700";
                  if (selectedAns !== null) {
                    if (opt.word === currentQuiz.correct) style = "bg-emerald-600 border-emerald-500 text-white";
                    else if (selectedAns === opt.word) style = "bg-rose-600 border-rose-500 text-white";
                    else style = "bg-slate-800/40 opacity-40";
                  }
                  return (
                    <button key={i} disabled={selectedAns !== null} onClick={() => handleAnswer(opt.word)} className={`p-3.5 border rounded-xl font-medium text-left transition-all ${style}`}>
                      {opt.word}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        }

        function BlockBlast({ vocabList }) {
          if (vocabList.length < 5) return <div className="text-center p-8 text-slate-500">Cần ít nhất 5 từ để chơi.</div>;
          const [blocks, setBlocks] = useState([]);
          const [selectedBlock, setSelectedBlock] = useState(null);
          const [score, setScore] = useState(0);
          const [wrongId, setWrongId] = useState(null);

          const initGame = () => {
            const selected = [...vocabList].sort(() => 0.5 - Math.random()).slice(0, 6);
            let pool = [];
            selected.forEach(item => {
              pool.push({ id: `w-${item.id}`, matchId: item.id, val: item.word, type: 'word' });
              pool.push({ id: `d-${item.id}`, matchId: item.id, val: item.definitionVn, type: 'def' });
            });
            setBlocks(pool.sort(() => 0.5 - Math.random())); setScore(0); setSelectedBlock(null);
          };

          useEffect(() => { initGame(); }, [vocabList]);

          const handleBlockClick = (block) => {
            if (!selectedBlock) { setSelectedBlock(block); return; }
            if (selectedBlock.id === block.id) { setSelectedBlock(null); return; }
            if (selectedBlock.matchId === block.matchId && selectedBlock.type !== block.type) {
              setScore(s => s + 20); setBlocks(b => b.filter(item => item.matchId !== block.matchId)); setSelectedBlock(null);
            } else {
              setScore(s => Math.max(0, s - 5)); setWrongId(`${block.id}_${selectedBlock.id}`); setSelectedBlock(null);
              setTimeout(() => setWrongId(null), 400);
            }
          };

          return (
            <div className="max-w-2xl mx-auto w-full h-full flex flex-col justify-between">
              <div className="flex justify-between items-center mb-2"><span className="text-cyan-400 font-bold">SCORE: {score}</span><button onClick={initGame} className="text-xs bg-slate-800 px-3 py-1 rounded">Reset</button></div>
              <div className="flex-1 flex items-center justify-center">
                {blocks.length === 0 ? (
                  <div className="text-center"><h3 className="text-xl font-bold mb-2">Thành Công!</h3><button onClick={initGame} className="bg-cyan-600 px-4 py-2 rounded-xl text-sm font-bold">Chơi lại</button></div>
                ) : (
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 w-full max-h-[70vh] overflow-y-auto">
                    {blocks.map(b => (
                      <button key={b.id} onClick={() => handleBlockClick(b)} className={`h-20 p-2 border rounded-xl text-xs font-semibold text-center transition-all ${selectedBlock?.id === b.id ? 'bg-indigo-600 border-indigo-400 text-white' : wrongId?.includes(b.id) ? 'bg-rose-600 border-rose-400 animate-shake' : 'bg-slate-800 border-slate-700 text-slate-200'}`}>
                        {b.val}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            </div>
          );
        }

        function Manage({ vocabList, setVocabList }) {
          const [singleWord, setSingleWord] = useState('');
          const [bulkWords, setBulkWords] = useState('');

          return (
            <div className="h-full flex flex-col w-full max-w-3xl mx-auto overflow-hidden">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4 shrink-0">
                <div className="bg-slate-800/40 p-3 border border-slate-800 rounded-xl">
                  <input type="text" value={singleWord} onChange={e => setSingleWord(e.target.value)} placeholder="Nhập từ English..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs mb-2" />
                  <button onClick={() => { if(singleWord) { setVocabList([autoGenerateData(singleWord), ...vocabList]); setSingleWord(''); } }} className="w-full bg-indigo-600 py-1.5 rounded-lg text-xs font-bold">THÊM TỪ</button>
                </div>
                <div className="bg-slate-800/40 p-3 border border-slate-800 rounded-xl">
                  <textarea rows={1} value={bulkWords} onChange={e => setBulkWords(e.target.value)} placeholder="Từ 1, Từ 2, Từ 3..." className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs mb-2 resize-none" />
                  <button onClick={() => { if(bulkWords) { const lines = bulkWords.split(/[\n,]+/).map(w=>w.trim()).filter(w=>w.length>0); setVocabList([...lines.map(w=>autoGenerateData(w)), ...vocabList]); setBulkWords(''); } }} className="w-full bg-emerald-600 py-1.5 rounded-lg text-xs font-bold">THÊM HÀNG LOẠT</button>
                </div>
              </div>
              <div className="flex-1 bg-slate-800/20 border border-slate-800 rounded-xl overflow-y-auto">
                <table className="w-full text-left border-collapse text-xs">
                  <thead className="bg-slate-950 sticky top-0"><tr class="text-slate-400"><th class="p-2.5">Từ vựng</th><th class="p-2.5">Nghĩa tiếng Việt</th><th class="p-2.5 text-right">Xóa</th></tr></thead>
                  <tbody className="divide-y divide-slate-800">
                    {vocabList.map(v => (
                      <tr key={v.id} className="hover:bg-slate-800/20">
                        <td className="p-2.5 font-bold text-white">{v.word}</td>
                        <td className="p-2.5 text-slate-300">{v.definitionVn}</td>
                        <td className="p-2.5 text-right"><button onClick={() => setVocabList(vocabList.filter(x=>x.id!==v.id))} className="text-rose-400 font-bold px-2">X</button></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        // Render app và load icon tự động
        const root = RoyalReactDOM =負 ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        setTimeout(() => { lucide.createIcons(); }, 500);
    </script>
</body>
</html>
